<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Microsoft Sign In</title>

<link rel="stylesheet"
href="css/auth-microsoft.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

</head>

<body>

<div class="ms-card">

    <img
        src="assets/microsoft.png"
        alt="Microsoft"
        class="ms-logo">

    <h1>Đăng nhập</h1>

    <p>
        Sử dụng tài khoản Microsoft của bạn
    </p>

    <input
        type="email"
        placeholder="Email, điện thoại hoặc Skype">

    <div class="link">

        Không có tài khoản?

        <a href="#">
            Tạo tài khoản!
        </a>

    </div>

    <button
        onclick="window.location.href='dashboard.html'">

        Tiếp theo

    </button>

</div>

</body>
</html>
